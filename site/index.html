<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com data:; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Cardápio - Com Carinho</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html { scroll-behavior: smooth; }
        :root {
            --escuro: #2a1a12;
            --marrom: #7d5648;
            --marrom-forte: #5b3a2e;
            --creme: #f2e6d7;
            --creme-fraco: #b39c88;
            --pagina: #f1ebe1;
            --cartao: #fbf8f3;
            --linha: #e7dcca;
            --texto: #3a2a20;
            --texto-fraco: #9c8b7c;
        }
        body {
            background-color: var(--pagina);
            color: var(--texto);
            padding-bottom: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .fixed-top {
            position: sticky;
            top: 0;
            background-color: var(--cartao);
            z-index: 100;
            box-shadow: 0 1px 0 rgba(0,0,0,0.05), 0 6px 18px rgba(42,26,18,0.10);
        }

        header {
            padding: 15px 14px 13px;
            text-align: center;
            background-color: var(--escuro);
        }
        header .marca-logo {
            font-size: 24px;
            line-height: 1;
        }
        header .marca-nome {
            font-family: Georgia, "Times New Roman", serif;
            font-style: italic;
            font-size: 24px;
            color: var(--creme);
            letter-spacing: 0.3px;
            margin-top: 3px;
        }
        header .marca-slogan {
            font-size: 10.5px;
            color: var(--creme-fraco);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .categorias-bar {
            position: relative;
            display: flex;
            gap: 2px;
            justify-content: safe center;
            max-width: 560px;
            margin: 0 auto;
            overflow-x: auto;
            white-space: nowrap;
            background: var(--cartao);
            border-bottom: 1px solid var(--linha);
            padding: 3px 10px 0;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            -webkit-user-select: none;
        }
        .categorias-bar::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: none;
            border: none;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 500;
            color: var(--texto-fraco);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: color 0.25s ease;
            outline: none;
        }

        .cat-btn.active {
            color: #5b3a2e;
            font-weight: 700;
        }

        .cat-indicador {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 3px;
            border-radius: 3px;
            background-color: #5b3a2e;
            transform: translateX(0);
            transition: transform 0.08s linear, width 0.08s linear;
            pointer-events: none;
            will-change: transform, width;
        }
        .cat-indicador.sem-transicao { transition: none; }

        .container { max-width: 560px; margin: 0 auto; padding: 10px 14px 0; }

        .categoria-secao { scroll-margin-top: var(--desloc, 112px); }

        .categoria-titulo {
            font-size: 17px;
            font-weight: 700;
            color: var(--texto);
            text-align: center;
            letter-spacing: 0.3px;
            margin: 26px 0 15px;
            padding-bottom: 9px;
            position: relative;
        }
        .categoria-titulo::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 34px;
            height: 3px;
            border-radius: 3px;
            background-color: #5b3a2e;
        }
        .categoria-secao:first-child .categoria-titulo { margin-top: 6px; }

        .categoria-titulo.anima {
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .categoria-titulo.anima::after {
            transition: opacity 0.4s ease 0.08s, width 0.4s ease 0.08s;
            opacity: 0;
            width: 0;
        }
        .categoria-titulo.anima.visivel {
            opacity: 1;
            transform: translateY(0);
        }
        .categoria-titulo.anima.visivel::after {
            opacity: 1;
            width: 34px;
        }

        .item-card {
            background-color: var(--cartao);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            border: 1px solid var(--linha);
            box-shadow: 0 1px 3px rgba(42,26,18,0.05);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .item-card:active {
            transform: scale(0.985);
            box-shadow: 0 1px 2px rgba(42,26,18,0.06);
        }

        .item-info { flex: 1; min-width: 0; }
        .item-titulo { font-size: 15px; font-weight: 700; color: var(--texto); margin-bottom: 3px; }
        .item-descricao {
            font-size: 12.5px;
            color: var(--texto-fraco);
            line-height: 1.35;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item-preco { font-size: 14px; font-weight: 700; color: #5b3a2e; }
        .item-imagem {
            width: 88px;
            height: 88px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #e7dcca;
            flex-shrink: 0;
        }

        .rodape-info {
            max-width: 560px;
            margin: 34px auto 0;
            padding: 18px 16px 4px;
            text-align: center;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--texto-fraco);
            border-top: 1px solid var(--linha);
        }
        .rodape-info a { color: var(--marrom-forte); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="fixed-top">
        <header>
            <div class="marca-logo">🥖</div>
            <div class="marca-nome">Com Carinho</div>
            <div class="marca-slogan">Cardápio &middot; Sabor em cada detalhe</div>
        </header>
        <div class="categorias-bar" id="categoriasBar"></div>
    </div>

    <main class="container" id="cardapio"></main>

    <footer class="rodape-info">
        <div>Rua Dona Fiota, 233 &ndash; Santa Ruth, Itabira/MG</div>
        <div>Contato: <a href="tel:+553138354125">(31) 3835-4125</a></div>
