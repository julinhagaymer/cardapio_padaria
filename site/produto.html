<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com data:; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Produto - Com Carinho</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        :root {
            --escuro: #2a1a12;
            --marrom: #7d5648;
            --marrom-forte: #5b3a2e;
            --creme: #f2e6d7;
            --pagina: #f1ebe1;
            --cartao: #fbf8f3;
            --linha: #e7dcca;
            --texto: #3a2a20;
            --texto-fraco: #9c8b7c;
        }
        body { background-color: var(--pagina); color: var(--texto); padding-bottom: 96px; }

        .topo {
            position: sticky;
            top: 0;
            background-color: var(--escuro);
            padding: 15px 16px;
            z-index: 10;
        }
        .voltar { color: var(--creme); text-decoration: none; font-size: 14px; letter-spacing: 0.2px; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

        .container.simples {
            display: flex;
            flex-direction: column;
            text-align: center;
            min-height: calc(100vh - 140px);
        }
        .container.simples .produto-foto {
            flex: 1 1 auto;
            height: auto;
            min-height: 240px;
        }
        .container.simples .secao { text-align: left; }

        .produto-foto {
            width: 100%;
            height: 200px;
            border-radius: 14px;
            background-color: #e7dcca;
            background-size: cover;
            background-position: center;
            margin-bottom: 16px;
        }

        .produto-nome { font-size: 22px; font-weight: 600; color: var(--texto); margin-bottom: 8px; }
        .produto-desc { font-size: 14px; color: #6f5d4e; line-height: 1.5; }
        .produto-preco { font-size: 18px; font-weight: 700; color: var(--marrom-forte); margin-top: 12px; }

        .secao { margin-top: 28px; }
        .secao-titulo { font-size: 15px; font-weight: 600; color: var(--texto); margin-bottom: 2px; }
        .secao-tag { font-size: 12px; margin-bottom: 12px; }
        .secao-tag.obrigatorio { color: var(--marrom-forte); }
        .secao-tag.opcional { color: var(--texto-fraco); }

        .bloco {
            background-color: var(--cartao);
            border: 1px solid var(--linha);
            border-radius: 12px;
            padding: 2px 16px;
        }

        .linha {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--linha);
            cursor: pointer;
        }
        .linha:last-child { border-bottom: none; }
        .linha-nome { font-size: 14px; color: var(--texto); }
        .linha-preco { font-size: 13px; color: #8a7869; margin-left: auto; }

        input[type="radio"], input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #cdbfae;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        input[type="radio"] { border-radius: 50%; margin-left: auto; }
        .linha-preco + input[type="radio"] { margin-left: 0; }
        input[type="checkbox"] { border-radius: 6px; }

        input[type="radio"]:checked { border-color: #5b3a2e; }
        input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background-color: #5b3a2e;
        }
        input[type="checkbox"]:checked { border-color: #5b3a2e; background-color: #5b3a2e; }
        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        textarea {
            width: 100%;
            border: 1px solid #d8ccba;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            min-height: 88px;
            background-color: #fff;
            color: var(--texto);
        }
        .contador { text-align: right; font-size: 12px; color: var(--texto-fraco); margin-top: 4px; }

        .erro { color: #b5322b; font-size: 12px; margin-top: 8px; display: none; }
        .erro.ativo { display: block; }

        .rodape {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--cartao);
            border-top: 1px solid var(--linha);
        }
        .rodape-inner {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .qtd { display: flex; align-items: center; gap: 14px; }
        .qtd button {
            width: 30px;
            height: 30px;
            border: 1px solid #d8ccba;
            background-color: #fff;
            border-radius: 50%;
            font-size: 16px;
            color: var(--texto);
            cursor: pointer;
        }
        .qtd span { font-size: 15px; min-width: 14px; text-align: center; }
        .total { font-size: 14px; color: #6f5d4e; }
        .total span { color: var(--texto); }
        .btn-pedir {
            margin-left: auto;
            background-color: #25d366;
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="topo">
        <a class="voltar" href="index.html">‹ Voltar ao cardápio</a>
    </div>

    <div class="container">
        <div class="produto-foto" id="produtoFoto"></div>
        <h1 class="produto-nome" id="produtoNome"></h1>
        <p class="produto-desc" id="produtoDesc"></p>
        <div class="produto-preco" id="produtoPreco" hidden></div>

        <div class="secao" id="secaoTamanho">
            <div class="secao-titulo">Escolha um tamanho</div>
            <div class="secao-tag obrigatorio">Obrigatório</div>
            <div class="bloco" id="listaTamanhos"></div>
            <div class="erro" id="erroTamanho">Selecione um tamanho.</div>
        </div>

        <div class="secao" id="secaoBorda">
            <div class="secao-titulo">Borda</div>
            <div class="secao-tag obrigatorio">Obrigatório</div>
            <div class="bloco" id="listaBordas"></div>
            <div class="erro" id="erroBorda">Selecione uma opção de borda.</div>
        </div>

        <div class="secao" id="secaoAdicionais">
            <div class="secao-titulo">Adicionais</div>
            <div class="secao-tag opcional">Opcional</div>
            <div class="bloco" id="listaAdicionais"></div>
        </div>

        <div class="secao">
            <div class="secao-titulo">Alguma observação?</div>
            <div class="secao-tag opcional">Opcional</div>
            <textarea id="observacao" maxlength="500"></textarea>
            <div class="contador"><span id="contadorObs">0</span>/500</div>
        </div>
    </div>

    <div class="rodape">
        <div class="rodape-inner">
            <div class="qtd">
                <button type="button" id="btnMenos">−</button>
                <span id="qtdNum">1</span>
                <button type="button" id="btnMais">+</button>
            </div>
            <div class="total">Total <span id="totalValor">R$ 0,00</span></div>
            <button class="btn-pedir" type="button" id="btnPedir">Pedir pelo WhatsApp</button>
        </div>
    </div>

    <script src="catalogo.php"></script>
    <script src="nucleo.js"></script>
    <script src="produto.js"></script>
</body>
</html>
